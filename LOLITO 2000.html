<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Comunicacion Avance e Instrospeccion (CA!)</title>
  <style>
    body {
      background-color: hsla(0, 0%, 2%, 1);
      background-image: radial-gradient(circle at 3% 101%, hsla(0, 0%, 2%, 1) 13.8%, transparent 65%), radial-gradient(circle at 98% 98%, hsla(0, 0%, 2%, 1) 15%, transparent 63.3%), radial-gradient(circle at 46% 98%, hsla(240, 0%, 2%, 1) 20.6%, transparent 49.6%), radial-gradient(circle at 3% 6%, rgba(255, 0, 0, 0.641) 15%, transparent 65%), radial-gradient(circle at 97% 7%, hsla(240, 7%, 29%, 1) 15%, transparent 65%);
      background-blend-mode: normal, normal, normal, normal, normal;
      margin: 0;
      min-height: 100vh;
    }

    header {
      background-image: url('');
      background-size: cover;
      background-position: center;
      color: rgb(209, 195, 175);
      padding: 40px 40px;
      text-align: center;
      margin-bottom: 0;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #cb0000;
      padding: 12px 24px;
      margin-bottom: 0;
      gap: 10px;
    }

    nav > div:first-child {
      display: flex;
      gap: 24px;
    }

    nav button {
      padding: 0;
      margin: 0;
      border: none;
      background: none;
      cursor: pointer;
      transform: scale(1.2);
      transition: transform 0.2s;
      /*prueba*/
        animation-name: shake;
        -webkit-animation-name: shake;
        -moz-animation-name: shake;
    animation-duration: 1s;
        -webkit-animation-duration: 1s;
        -moz-animation-duration: 1s;
    animation-iteration-count: infinite;
        -webkit-animation-iteration-count: infinite;
        -moz-animation-iteration-count: infinite;
    }

    nav button img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 8px;
      transition: box-shadow 0.2s, transform 0.2s;
      animation-name: flicker;
      animation-duration: 1s;
      animation-iteration-count: infinite;
    }
    nav button img:hover {
      box-shadow: 0 0 8px #cabda5;
      transform: scale(1.4);
    }
    @keyframes flicker {
      0% {opacity: 1;}
      25% {opacity: 0.5;}
      50% {opacity: 1;}
      75% {opacity: 0.5;}
      100% {opacity: 1;}
    }
         
    @keyframes shake {
        0%  {transform: translate(1px, 1px) rotate(0deg);}
        10% {transform: translate(-1px, -2px) rotate(-1deg);}
        20% {transform: translate(-3px, 0px) rotate(1deg);}
        30% {transform: translate(3px, 2px) rotate(0deg);}
        40% {transform: translate(1px, -1px) rotate(1deg);}
        50% {transform: translate(-1px, 2px) rotate(-1deg);}
        60% {transform: translate(-3px, 1px) rotate(0deg);}
        70% {transform: translate(3px, 1px) rotate(-1deg);}
        80% {transform: translate(-1px, -1px) rotate(1deg);}
        90% {transform: translate(1px, 2px) rotate(0deg);}
        100% {transform: translate(1px, -2px) rotate(-1deg);}
    }
              

    #wiki-search-bar {
      min-width: 180px;
    }
    #wiki-search-bar input {
      padding: 8px;
      font-size: 15px;
      border-radius: 4px;
      border: 1px solid #cabda5;
      background: #222;
      color: #fff;
    }

    .layout {
      display: flex;
      flex-direction: row;
      width: 100%;
      min-height: 70vh;
      gap: 0;
    }

    aside#sidebar {
      width: 280px;
      min-width: 200px;
      background: rgba(255,255,255,0.07);
      background-image: url('ruta/a/tu-imagen-aside.jpg');
      background-size: cover;
      background-position: center;
      padding: 28px 18px;
      border-right: 1px solid #ccc;
      color: rgb(139, 86, 12);
      box-sizing: border-box;
      overflow-y: auto;
      height: auto;
    }
    aside h2 {
      margin-top: 0;
      margin-bottom: 18px;
      font-size: 1.2em;
    }
    #article-list {
      padding-left: 0;
      list-style: none;
    }
    #article-list li {
      margin-bottom: 12px;
    }
    #article-list a {
      color: #cabda5;
      font-weight: bold;
      font-size: 1em;
      padding: 3px 0;
      display: inline-block;
    }
    #article-list a:hover {
      color: #ffcc66;
      text-decoration: underline;
    }
 main#main-content2{
      flex: 1;
     
      background-size: cover;
      background-position: center;
      padding: 36px 32px;
      box-sizing: border-box;
      color: rgb(77, 40, 10);
      min-width: 0;
      min-height: 70vh;
      overflow-y: auto;
 }
    main#main-content {
      flex: 1;
     
      background-size: cover;
      background-position: center;
      padding: 36px 32px;
      box-sizing: border-box;
      color: rgb(77, 40, 10);
      min-width: 0;
      min-height: 70vh;
      overflow-y: auto;
    }
    main h1, main h2 {
      margin-top: 0;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 8px;
      margin: 10px 0;
      box-sizing: border-box;
      font-size: 1em;
      border-radius: 4px;
      border: 1px solid #cabda5;
      background: #fff8;
      color: #222;
    }

    button:not(.nav-btn) {
      padding: 8px 16px;
      margin-top: 8px;
      background: #cb0000;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s, transform 0.2s;
      display: block;
    }
    button:not(.nav-btn):hover {
      background: #a00000;
      transform: scale(1.05);
    }

    .question {
      border: 1px solid #ffffff;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 24px;
      background-color: rgba(0, 0, 0, 0.3);
    }

    .answers {
      margin-top: 10px;
      padding-left: 20px;
    }

    .answer {
      margin-bottom: 10px;
    }

    a {
      text-decoration: none;
      color: #0066cc;
    }
    a:hover {
      text-decoration: underline;
    }

    /* Typing animation header */
    .typing-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 36px 0 10px 0;
      background: none;
    }
    .typing {
      font-family: monospace;
      font-size: 2rem;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      border-right: 3px solid #6f42c1;
      width: 0ch;
      animation: typing 6s steps(12) forwards, blink 0.6s step-end infinite;
    }
    @keyframes typing {
      from { width: 0ch }
      to { width: 15ch }
    }
    @keyframes blink {
      50% { border-color: transparent }
    }

    /* Responsive */
    @media (max-width: 900px) {
      .layout {
        flex-direction: column;
      }
      aside#sidebar {
        width: 100%;
        min-width: 0;
        border-right: none;
        border-bottom: 1px solid #ccc;
        padding: 18px 12px;
      }
      main#main-content {
        padding: 28px 10px;
      }
    }
    @media (max-width: 600px) {
      nav {
        flex-direction: column;
        padding: 10px 6px;
        gap: 6px;
      }
      nav > div:first-child {
        gap: 10px;
      }
      .typing-container {
        padding: 30px 0 5px 0;
      }
    }
  </style>
</head>

    const questions = [];

    function switchSection(section) {
      const sidebar = document.getElementById("sidebar");
      const searchBar = document.getElementById("wiki-search-bar");

      if (section === 'wiki') {
        sidebar.style.display = "block";
        searchBar.style.display = "block";
        renderWikiHome();
        showArticleList();
      } else {
        sidebar.style.display = "none";
        searchBar.style.display = "none";
        renderForum();
      }
    }

    function renderWikiHome() {
      const main = document.getElementById("main-content");
      main.innerHTML = `
        <h2>Bienvenido a la Enciclopedia</h2>
        <p>Selecciona un articulo desde el menu lateral para comenzar.</p>
      `;
    }

    function showArticleList() {
      const list = document.getElementById("article-list");
      list.innerHTML = "";
      for (const key in articles) {
        const li = document.createElement("li");
        li.innerHTML = `<a href="#" onclick="showArticle('${key}')">${articles[key].title}</a>`;
        list.appendChild(li);
      }
    }

    function showArticle(key) {
      const article = articles[key];
      const content = document.getElementById("main-content");
      content.innerHTML = `
        <h2>${article.title}</h2>
        <img src="${article.image}" alt="${article.title}" style="max-width: 100%; height: auto; margin: 20px 0; border-radius: 10px;">
        <p>${article.content}</p>
      `;
    }

    function filterArticles() {
      const query = document.getElementById("search").value.toLowerCase();
      const list = document.getElementById("article-list");
      list.innerHTML = "";
      for (const key in articles) {
        if (articles[key].title.toLowerCase().includes(query)) {
          const li = document.createElement("li");
          li.innerHTML = `<a href="#" onclick="showArticle('${key}')">${articles[key].title}</a>`;
          list.appendChild(li);
        }
      }
    }

    function renderForum() {
      const main = document.getElementById("main-content");
      main.innerHTML = `
        <h2>Hacer una pregunta</h2>
        <input type="text" id="question-title" placeholder="Titulo de la pregunta">
        <textarea id="question-body" placeholder="Escribe tu pregunta aquí..."></textarea>
        <button onclick="addQuestion()">Publicar pregunta</button>
        <h2>Preguntas</h2>
        <div id="questions-container"></div>
      `;
      renderQuestions();
    }

    function addQuestion() {
      const title = document.getElementById("question-title").value.trim();
      const body = document.getElementById("question-body").value.trim();
      if (title && body) {
        questions.push({ title, body, answers: [] });
        document.getElementById("question-title").value = "";
        document.getElementById("question-body").value = "";
        renderQuestions();
      } else {
        alert("Por favor completa ambos campos.");
      }
    }

    function addAnswer(index) {
      const input = document.getElementById(`answer-input-${index}`);
      const text = input.value.trim();
      if (text) {
        questions[index].answers.push(text);
        renderQuestions();
      } else {
        alert("La respuesta no puede estar vacía.");
      }
    }

    function renderQuestions() {
      const container = document.getElementById("questions-container");
      if (!container) return;
      container.innerHTML = "";
      questions.forEach((q, i) => {
        const qDiv = document.createElement("div");
        qDiv.className = "question";
        qDiv.innerHTML = `
          <h3>${q.title}</h3>
          <p>${q.body}</p>
          <div class="answers">
            <strong>Respuestas:</strong>
            ${q.answers.map(a => `<div class="answer">- ${a}</div>`).join("")}
            <textarea id="answer-input-${i}" placeholder="Escribe una respuesta..."></textarea>
            <button onclick="addAnswer(${i})">Responder</button>
          </div>
        `;
        container.appendChild(qDiv);
      });
    }

    // Inicializa la vista principal
    switchSection('wiki');
  </script>
